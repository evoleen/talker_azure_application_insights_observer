name: Sanity Test

on:
  push:

jobs:
  Sanity:
    runs-on: ubuntu-latest
    steps:
      - name: 📚 Checkout
        uses: actions/checkout@v7

      - name: 👴🏼 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🏗️ Install packages
        run: dart pub get

      - name: Validate package
        run: dart pub publish --dry-run